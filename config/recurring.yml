production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  expire_commerce_checkouts:
    class: ExpireCommerceCheckoutsJob
    queue: default
    schedule: every 5 minutes
  expire_social_stories:
    class: ExpireSocialStoriesJob
    queue: default
    schedule: every 1 day at 3am UTC
  expire_pending_offers:
    class: ExpirePendingOffersJob
    queue: default
    schedule: every 15 minutes
  auto_cancel_stale_orders:
    class: AutoCancelStaleOrdersJob
    queue: default
    schedule: every 10 minutes
