# Official Mini-Apps Configuration
# This file defines official mini-apps that are automatically created and approved
# Changes to this file can be applied with: rails mini_apps:load_from_yaml

official_mini_apps:
  - app_id: ma_tweensocial
    name: Tween Social
    description: Official Tween social networking application
    version: "1.0.0"
    classification: official
    oauth_client_type: public
    developer_name: Tween IM
    manifest:
      permissions:
        - user_read
        - social_read
        - social_write
        - social_engage
        - storage_read
        - storage_write
        - messaging_send
      scopes:
        - user:read
        - social:read
        - social:write
        - social:engage
        - storage:read
        - storage:write
        - messaging:send
      entry_url: "https://miniapp.tween.im/tweensocial/"
      redirect_uris:
        - "https://miniapp.tween.im/tweensocial/callback"
      icon_url: "https://cdn.tween.im/icons/tweensocial.png"
      categories:
        - social
          - networking
          - communication
      features:
        - social_feed
        - photo_sharing
        - video_sharing
        - stories
        - likes_reactions
        - comments
        - user_profiles
        - follow_system
        - direct_messaging

  - app_id: ma_tweenpay
    name: TweenPay
    description: Official Tween wallet and payment application
    version: "1.0.0"
    classification: official
    oauth_client_type: public
    developer_name: Tween IM
    manifest:
      permissions:
        - wallet_balance
        - wallet_pay
        - wallet_history
        - user_read
        - storage_read
        - storage_write
        - messaging_send
      scopes:
        - wallet:balance
        - wallet:pay
        - wallet:history
        - user:read
        - storage:read
        - storage:write
        - messaging:send
      entry_url: "https://miniapp.tween.im/tweenpay/"
      redirect_uris:
        - "https://miniapp.tween.im/tweenpay/callback"
      webhook_url: "https://api.tween.im/webhooks/tweenpay"
      icon_url: "https://cdn.tween.im/icons/tweenpay.png"
      categories:
        - finance
          - wallet
          - payments
      features:
        - p2p_payments
        - balance_check
        - transaction_history
        - group_gifts
        - qr_payments
        - contact_payments

  - app_id: ma_tweencommerce
    name: TweenCommerce
    description: Official Tween marketplace for buying and selling
    version: "1.0.0"
    classification: official
    oauth_client_type: public
    developer_name: Tween IM
    manifest:
      permissions:
        - wallet_pay
        - user_read
        - storage_read
        - storage_write
        - messaging_send
      scopes:
        - wallet:pay
        - user:read
        - storage:read
        - storage:write
        - messaging:send
      entry_url: "https://miniapp.tween.im/tweencommerce/"
      redirect_uris:
        - "https://miniapp.tween.im/tweencommerce/callback"
      webhook_url: "https://api.tween.im/webhooks/tweencommerce"
      icon_url: "https://cdn.tween.im/icons/tweencommerce.png"
      categories:
        - shopping
          - marketplace
          - commerce
      features:
        - product_listings
        - secure_payments
        - order_tracking
        - seller_dashboard
        - reviews_ratings
